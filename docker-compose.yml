# Environnement local.
#   docker compose up -d                     → PostgreSQL + Keycloak (backend et frontend lancés à la main)
#   docker compose --profile complet up -d --build
#                                             → tout faro d'un coup : http://localhost:3000 (demo / demo),
#                                               avec des affaires d'exemple sur une base neuve
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: faro
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: faro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro -d faro"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  backend:
    profiles: ["complet"]
    build: ./backend
    environment:
      FARO_DB_URL: jdbc:postgresql://postgres:5432/faro
      # Le navigateur obtient ses jetons sur localhost:8180 (émetteur vérifié) ; les clés sont lues
      # directement sur le réseau Docker.
      FARO_OIDC_ISSUER_URI: http://localhost:8180/realms/faro
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/faro/protocol/openid-connect/certs
      FARO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Affaires d'exemple chargées au premier démarrage, seulement si la base est vide.
      FARO_DEMO_DONNEES: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["complet"]
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8180/realms/faro
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak

volumes:
  postgres-data:
