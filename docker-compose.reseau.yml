# Mode « réseau local » : faro accessible depuis les autres appareils du wifi, en HTTPS, sur une seule adresse
# (https://FARO_HOTE : l'application, et /auth pour la connexion Keycloak). Voir docs/reseau-local.md.
#
#   FARO_HOTE=192.168.1.20 docker compose --profile complet -f docker-compose.yml -f docker-compose.reseau.yml up -d --build
services:
  keycloak:
    command: ["start-dev", "--import-realm", "--http-port=8180", "--http-relative-path=/auth"]
    environment:
      KC_HOSTNAME: https://${FARO_HOTE:?adresse IP du PC sur le wifi requise (ex. 192.168.1.20)}/auth
      KC_PROXY_HEADERS: xforwarded
      FARO_URL: https://${FARO_HOTE}
    # Inutile ici (tout passe par Caddy sur /auth) : évite un conflit avec un autre Keycloak sur 8180.
    ports: !reset []
    volumes: !override
      - ./keycloak/reseau:/opt/keycloak/data/import:ro
      - keycloak-data-reseau:/opt/keycloak/data

  backend:
    environment:
      FARO_OIDC_ISSUER_URI: https://${FARO_HOTE}/auth/realms/faro
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/auth/realms/faro/protocol/openid-connect/certs
      FARO_CORS_ALLOWED_ORIGINS: https://${FARO_HOTE}

  frontend:
    # Servi uniquement par Caddy (https://FARO_HOTE) : pas de port 3000 sur la machine.
    ports: !reset []
    build:
      args:
        # Vide : l'adresse de connexion est déduite de celle de la page (https://FARO_HOTE/auth/realms/faro).
        VITE_OIDC_AUTHORITY: ""

  # HTTPS avec un certificat généré localement (avertissement à accepter une fois sur chaque appareil).
  caddy:
    image: caddy:2.10
    profiles: ["complet"]
    environment:
      FARO_HOTE: ${FARO_HOTE}
    ports:
      - "443:443"
    volumes:
      - ./docker/Caddyfile.reseau:/etc/caddy/Caddyfile:ro
      - caddy-data-reseau:/data
    depends_on:
      - frontend
      - keycloak

volumes:
  keycloak-data-reseau:
  caddy-data-reseau:
