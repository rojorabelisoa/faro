spring:
  application:
    name: faro-backend
  datasource:
    url: ${FARO_DB_URL:jdbc:postgresql://localhost:5432/faro}
    username: ${FARO_DB_USER:faro}
    password: ${FARO_DB_PASSWORD:faro}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fournisseur OIDC : Keycloak local par défaut (voir docker-compose.yml).
          issuer-uri: ${FARO_OIDC_ISSUER_URI:http://localhost:8180/realms/faro}
          audiences: ${FARO_OIDC_AUDIENCE:faro-api}

faro:
  cors:
    allowed-origins: ${FARO_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
