spring:
  application:
    name: faro-backend
  datasource:
    url: ${FARO_DB_URL:jdbc:postgresql://localhost:5432/faro}
    username: ${FARO_DB_USER:faro}
    password: ${FARO_DB_PASSWORD:faro}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Photos de visite (réduites par le navigateur avant envoi) et fichiers CSV.
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fournisseur OIDC : Keycloak local par défaut (voir docker-compose.yml).
          issuer-uri: ${FARO_OIDC_ISSUER_URI:http://localhost:8180/realms/faro}
          audiences: ${FARO_OIDC_AUDIENCE:faro-api}

faro:
  demo:
    # Charge des affaires d'exemple au premier démarrage (profil Docker « complet » uniquement).
    donnees: ${FARO_DEMO_DONNEES:false}
  cors:
    allowed-origins: ${FARO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  client:
    # Durée de validité d'un lien d'espace client (et d'une prolongation), en jours.
    duree-lien-jours: ${FARO_CLIENT_DUREE_LIEN_JOURS:90}
  public:
    # Limite par adresse IP des requêtes sur l'espace client public (/api/public/**), en mémoire. Voir
    # LimiteRequetesPubliques et docs/deploiement.md.
    limite:
      active: ${FARO_LIMITE_PUBLIC_ACTIVE:true}
      requetes-par-minute: ${FARO_LIMITE_PUBLIC_PAR_MINUTE:60}
      # Nombre de proxys faro devant le backend dont on lit X-Forwarded-For (0 : adresse de la connexion seule).
      # Caddy + nginx (production, réseau local) : 2 ; nginx seul (Docker « complet ») : 1.
      proxys-de-confiance: ${FARO_PROXYS_DE_CONFIANCE:0}

management:
  endpoints:
    web:
      exposure:
        include: health
